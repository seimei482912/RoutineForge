<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>RoutineForge</title>
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="RoutineForge" />
<style>
:root{
  --ink:#000000; --panel:#161C24; --well:#1B222C; --line:#28323E; --line2:#394656;
  --tx:#E8EFF6; --tx2:#93A2B3; --tx3:#61707F;
  --cy:#28b6ff; --cy-d:#0d5f8a;
  --ye:#FFD23F; --rd:#FF6B6B; --or:#E8873C;
  --f-ui:"Yu Gothic UI","Meiryo",sans-serif;
  --f-dis:"BIZ UDPGothic","BIZ UDGothic","Yu Gothic UI",sans-serif;
  --f-mono:"MS Gothic","Consolas",monospace;
}
*{box-sizing:border-box; border-radius:0 !important;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--tx);font-family:var(--f-ui);
  -webkit-font-smoothing:antialiased; font-feature-settings:"palt" 1; overscroll-behavior:none;}
body{
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 4px),
                    repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 4px);
}
button{font-family:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums;}
#app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);}

.pxi{width:18px; height:18px; shape-rendering:crispEdges; fill:currentColor; display:block;}

/* ---- top bar ---- */
.topbar{background:#000000; border-bottom:2px solid var(--line2); padding:14px 16px;
  display:flex; align-items:center; justify-content:space-between;}
.brand{font-family:var(--f-dis); font-weight:700; font-size:15px; letter-spacing:.12em; color:var(--cy);}
.tabs{display:flex; gap:0; border:2px solid var(--line2);}
.tabs button{background:var(--well); border:none; padding:6px 12px; font-size:12px; color:var(--tx2);}
.tabs button + button{border-left:2px solid var(--line2);}
.tabs button.active{background:var(--cy-d); color:var(--tx);}

/* ---- well ---- */
.well{background:var(--well); border:2px solid var(--line); position:relative; padding:14px;}

/* ---- routine list ---- */
.list{padding:12px 16px 100px; display:flex; flex-direction:column; gap:10px;}
.rcard{display:flex; align-items:center; gap:12px; padding:12px; border-left:3px solid transparent;}
.rcard.done-today{background:rgba(255,210,63,.14); border-left-color:var(--ye);}
.rcard .meta{flex:1; min-width:0;}
.rcard .meta .name{font-family:var(--f-dis); font-size:15px; font-weight:700;}
.rcard .meta .sub{font-size:11px; color:var(--tx2); margin-top:4px; font-family:var(--f-mono);}
.rcard .streak{font-family:var(--f-mono); font-size:11px; color:var(--ye); text-align:right; margin-right:4px;}
.rcard .streak b{font-size:16px; display:block;}
.btn-sq{border:2px solid var(--line2); background:var(--panel); width:38px; height:38px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,.05), inset -2px -2px 0 rgba(0,0,0,.35);}
.btn-sq.play{color:var(--cy);}
.btn-sq.redo{color:var(--ye); font-family:var(--f-mono); font-size:14px; font-weight:700;}
.btn-sq:active{box-shadow: inset -2px -2px 0 rgba(255,255,255,.05), inset 2px 2px 0 rgba(0,0,0,.35);}

.fab{position:fixed; right:20px; bottom:20px; width:52px; height:52px; background:var(--cy);
  color:var(--ink); border:2px solid var(--cy-d); display:flex; align-items:center; justify-content:center;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -2px 0 rgba(0,0,0,.35);
  z-index:20;}
.fab .pxi{width:22px; height:22px;}
.fab:active{box-shadow: inset -2px -2px 0 rgba(255,255,255,.35), inset 2px 2px 0 rgba(0,0,0,.35);}

.empty-hint{color:var(--tx3); font-size:12px; text-align:center; padding:24px 0;}

/* ---- stats view ---- */
.chip-row{display:flex; gap:6px; padding:12px 16px 0; overflow-x:auto;}
.chip{flex-shrink:0; border:2px solid var(--line2); background:var(--panel); color:var(--tx2); padding:6px 12px; font-size:12px; white-space:nowrap;}
.chip.on{background:var(--cy-d); border-color:var(--cy); color:var(--tx);}
.stats-body{padding:12px 16px 100px; display:flex; flex-direction:column; gap:10px;}
.month-well{padding:14px;}
.month-title{font-family:var(--f-dis); font-size:13px; font-weight:700; margin-bottom:10px; text-align:center;}
.month-head{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px;}
.month-head div{text-align:center; font-size:10px; color:var(--tx3); font-family:var(--f-mono);}
.month-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.mday{aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:11px; font-family:var(--f-mono);
  border:1px dashed var(--line2); color:var(--tx3);}
.mday.empty{border:none;}
.mday.done{background:var(--cy); border:1px solid var(--cy-d); color:var(--ink); border-style:solid;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.25);}
.mday.today{background:var(--ye); border:1px solid #8a6a10; color:var(--ink); border-style:solid;
  box-shadow:inset -2px -2px 0 rgba(0,0,0,.25);}

/* ---- timer view ---- */
.timer-wrap{flex:1; display:flex; flex-direction:column; padding:16px;}
.timer-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.timer-head button{background:none; border:2px solid var(--line2); width:32px; height:32px; color:var(--tx2);
  display:flex; align-items:center; justify-content:center;}
.timer-head .pxi{width:14px; height:14px;}
.step-name{font-family:var(--f-dis); font-size:22px; font-weight:700; text-align:center; margin:14px 0 4px;}
.ring-wrap{width:230px; height:230px; margin:8px auto 0; position:relative;}
.ring-wrap svg.ring{width:100%; height:100%; shape-rendering:crispEdges; overflow:visible; display:block;}
.ring-tick{fill:var(--well); stroke:var(--line); stroke-width:1;}
.ring-tick.on{fill:var(--cy); stroke:var(--cy-d);}
.ring-tick.warn{fill:var(--or); stroke:#8a4d1c;}
.ring-tick.over{fill:var(--rd); stroke:#7a2b2b; animation:tickBlink 1s steps(2) infinite;}
@keyframes tickBlink{50%{fill-opacity:.35;}}
.ring-inner{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;}
.ring-inner .countdown{font-family:var(--f-mono); font-size:36px; font-variant-numeric:tabular-nums; letter-spacing:.04em;}
.ring-inner .countdown.over{color:var(--rd); animation:overBlink 1s steps(2) infinite;}
@keyframes overBlink{50%{opacity:.35;}}
.ring-inner .step-count{font-family:var(--f-mono); font-size:11px; color:var(--tx3);}
.ring-inner .over-label{font-size:11px; color:var(--rd); letter-spacing:.05em;}
.ring-inner .pause-label{font-size:11px; color:var(--tx2); letter-spacing:.05em;}
.paused .ring-wrap svg.ring{opacity:.45;}
.time-adjust{display:flex; justify-content:center; gap:10px; margin-top:14px;}
.time-adjust button{border:2px solid var(--line2); background:var(--panel); color:var(--tx2); padding:6px 14px; font-size:12px; font-family:var(--f-mono);}
.time-adjust button:active{background:var(--well); color:var(--tx);}

.modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:60; display:flex; align-items:flex-end; justify-content:center;}
.modal-sheet{width:100%; max-width:480px; padding:20px 16px; display:flex; flex-direction:column; gap:10px; border-bottom:none;}
.modal-title{font-family:var(--f-dis); font-size:15px; font-weight:700; text-align:center; margin-bottom:6px;}
.btn-wide.danger{background:var(--panel); color:var(--rd); border-color:var(--rd);}
.btn-wide.ghost{background:none; color:var(--tx2); border-color:var(--line2); box-shadow:none;}
.timer-controls{display:flex; justify-content:center; gap:18px; margin:22px 0 10px;}
.timer-controls button{width:56px; height:56px; border:2px solid var(--line2); background:var(--panel); color:var(--tx);
  display:flex; align-items:center; justify-content:center;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,.06), inset -2px -2px 0 rgba(0,0,0,.4);}
.timer-controls button .pxi{width:20px; height:20px;}
.timer-controls button.main{background:var(--cy-d); border-color:var(--cy); width:66px; height:66px;}
.timer-controls button.main .pxi{width:24px; height:24px;}
.timer-controls button:active{box-shadow: inset -2px -2px 0 rgba(255,255,255,.06), inset 2px 2px 0 rgba(0,0,0,.4);}
.step-preview{margin-top:auto; border-top:2px solid var(--line); padding-top:10px;}
.step-preview .row{display:flex; align-items:center; gap:8px; padding:7px 8px; font-size:12px; color:var(--tx2);
  border-left:3px solid transparent; min-height:30px;}
.step-preview .row .mk{font-family:var(--f-mono); width:12px; flex-shrink:0; color:var(--ye);}
.step-preview .row.cur{color:var(--ye);}
.step-preview .row.done{background:rgba(255,210,63,.14); border-left-color:var(--ye); color:var(--tx2);
  text-decoration:line-through; text-decoration-style:solid; text-decoration-color:var(--tx3);}
.finish-eta{font-family:var(--f-mono); font-size:11px; color:var(--tx3); text-align:center; margin-top:8px;}

/* ---- celebration ---- */
.celebrate{position:fixed; inset:0; background:var(--ink); z-index:50; display:flex; align-items:center;
  justify-content:center; flex-direction:column;}
.celebrate.flash{animation:flash .5s steps(3);}
@keyframes flash{0%{background:var(--ye);} 100%{background:var(--ink);}}
.celebrate .txt{font-family:var(--f-dis); font-size:26px; font-weight:700; color:var(--ye);
  overflow:hidden; white-space:nowrap; width:0; animation:wipe 1s steps(7) forwards .1s;}
@keyframes wipe{to{width:100%;}}
.spark{position:absolute; width:6px; height:6px; background:var(--ye); animation:sparkStep .9s steps(3) forwards;}
@keyframes sparkStep{to{transform:translateY(-24px); opacity:0;}}

/* ---- summary ---- */
.summary{padding:16px; display:flex; flex-direction:column; gap:14px;}
.stat-row{display:flex; gap:10px;}
.stat-tile{flex:1; text-align:center; padding:14px 0;}
.stat-tile .lbl{font-size:11px; color:var(--tx2);}
.stat-tile .val{font-family:var(--f-mono); font-size:30px; font-weight:700; margin-top:4px; color:var(--cy);}
.total-row{display:flex; align-items:baseline; justify-content:space-between;}
.total-row .val{font-family:var(--f-mono); font-size:26px;}
.total-row .diff{font-family:var(--f-mono); font-size:12px; color:var(--tx3); border:1px solid var(--line2); padding:2px 6px;}
.total-row .diff.overrun{color:var(--rd); border-color:var(--rd);}
.slist .srow{display:flex; align-items:center; gap:10px; padding:8px; border-top:1px solid var(--line); border-left:3px solid transparent;}
.slist .srow.done{background:rgba(255,210,63,.14); border-left-color:var(--ye);}
.slist .srow .nm{flex:1; font-size:13px;}
.slist .srow .tm{font-family:var(--f-mono); font-size:11px; color:var(--tx2);}
.slist .srow .tm.overrun{color:var(--rd);}
.slist .srow .ck{color:var(--tx2); font-weight:700; font-family:var(--f-mono);}
.slist .srow.done .ck{color:var(--ye);}
.btn-wide{width:100%; padding:14px; text-align:center; background:var(--cy); color:var(--ink); border:2px solid var(--cy-d);
  font-weight:700; font-size:14px; box-shadow: inset 2px 2px 0 rgba(255,255,255,.3), inset -2px -2px 0 rgba(0,0,0,.3);}
.btn-wide:active{box-shadow: inset -2px -2px 0 rgba(255,255,255,.3), inset 2px 2px 0 rgba(0,0,0,.3);}

/* ---- edit form ---- */
.form{padding:16px; display:flex; flex-direction:column; gap:14px; padding-bottom:100px;}
.field label{display:block; font-size:11px; color:var(--tx2); margin-bottom:6px;}
.field input[type=text],.field input[type=number]{
  width:100%; background:var(--well); border:2px solid var(--line2); color:var(--tx); padding:10px; font-size:14px; font-family:inherit;}
.steps-edit .step-row{display:flex; gap:6px; align-items:center; padding:8px; background:var(--well); border:1px solid var(--line); margin-bottom:8px;}
.steps-edit .step-row input[type=text]{flex:2; min-width:0; background:var(--panel); border:1px solid var(--line2); color:var(--tx); padding:8px; font-family:inherit;}
.steps-edit .step-row input.dur{flex:0 0 58px; background:var(--panel); border:1px solid var(--line2); color:var(--tx); padding:8px; font-family:var(--f-mono);}
.steps-edit .step-row .ord{display:flex; flex-direction:column; gap:2px; flex-shrink:0;}
.steps-edit .step-row .ord button{width:24px; height:15px; background:var(--panel); border:1px solid var(--line2); color:var(--tx3);
  display:flex; align-items:center; justify-content:center; padding:0;}
.steps-edit .step-row .ord button .pxi{width:10px; height:10px;}
.steps-edit .step-row .ord button:disabled{opacity:.25;}
.steps-edit .step-row button.rm{flex:0 0 30px; height:30px; background:var(--panel); border:1px solid var(--rd); color:var(--rd);
  display:flex; align-items:center; justify-content:center;}
.steps-edit .step-row button.rm .pxi{width:12px; height:12px;}
.add-step-btn{border:2px dashed var(--line2); background:none; color:var(--tx2); padding:10px; font-size:12px; width:100%;}
.danger-btn{border:2px solid var(--rd); background:var(--panel); color:var(--rd); padding:12px; font-size:13px; font-weight:700;}

@media (prefers-reduced-motion: reduce){
  .ring-tick.over,.ring-inner .countdown.over,.celebrate.flash,.spark{animation:none;}
  .celebrate .txt{animation:none; width:100%;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ============ pixel icons (rect-only, PC-98 style) ============ */
function px(shapes, cls){
  const rects = shapes.map(s=>`<rect x="${s[0]}" y="${s[1]}" width="${s[2]}" height="${s[3]}"></rect>`).join("");
  return `<svg viewBox="0 0 16 16" class="pxi${cls?" "+cls:""}" aria-hidden="true">${rects}</svg>`;
}
const ICON = {
  play:  [[5,3,2,10],[7,4,2,8],[9,5,2,6],[11,6,2,4]],
  pause: [[4,3,3,10],[9,3,3,10]],
  check: [[2,8,2,2],[3,9,2,2],[4,10,2,2],[5,9,2,2],[6,8,2,2],[7,7,2,2],[8,6,2,2],[9,5,2,2],[10,4,2,2],[11,3,2,2]],
  skip:  [[3,3,2,10],[5,4,2,8],[7,5,2,6],[9,6,2,4],[12,3,2,10]],
  close: [[3,3,2,2],[5,5,2,2],[7,7,2,2],[9,9,2,2],[11,11,2,2],[11,3,2,2],[9,5,2,2],[5,9,2,2],[3,11,2,2]],
  plus:  [[7,3,2,10],[3,7,10,2]],
  up:    [[7,4,2,2],[5,6,6,2],[3,8,10,2]],
  down:  [[3,6,10,2],[5,8,6,2],[7,10,2,2]]
};

/* ============ sound / vibration ============ */
let audioCtx = null;
function ensureAudio(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
  }catch(e){}
}
function beep(freq, dur, when){
  if(!audioCtx) return;
  try{
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.value = 0.04;
    o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime + (when||0);
    o.start(t); o.stop(t + dur);
  }catch(e){}
}
function beepTimeUp(){
  ensureAudio();
  beep(880, 0.09, 0);
  beep(1320, 0.12, 0.15);
  if(navigator.vibrate) navigator.vibrate([120,60,120]);
}
function beepAdvance(){
  ensureAudio();
  beep(660, 0.06, 0);
}

/* ============ wake lock ============ */
let wakeLock = null;
async function acquireWakeLock(){
  try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
function releaseWakeLock(){
  try{ if(wakeLock) wakeLock.release(); }catch(e){}
  wakeLock = null;
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && timerState) acquireWakeLock();
});

/* ============ storage ============ */
const STORE_KEY = "routineforge_data_v1";

function loadData(){
  const raw = localStorage.getItem(STORE_KEY);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  const data = {
    routines: [
      {
        id: "r_morning", name: "朝のルーティン",
        steps: [
          {id:"s1", name:"背伸びをして水を一杯飲む", duration:120},
          {id:"s2", name:"ベッドを整える", duration:120},
          {id:"s3", name:"天気を確認する", duration:120}
        ]
      },
      {
        id: "r_night", name: "ナイトルーティン",
        steps: [
          {id:"s4", name:"机の上を片付ける", duration:180},
          {id:"s5", name:"明日の準備をする", duration:180},
          {id:"s6", name:"軽くストレッチする", duration:120}
        ]
      }
    ],
    logs: [] // {date:"YYYY-MM-DD", routineId, actualSeconds, plannedSeconds, startTime, steps:[{name,duration,actual}]}
  };
  saveData(data);
  return data;
}
function saveData(d){ localStorage.setItem(STORE_KEY, JSON.stringify(d)); }
let DATA = loadData();

function todayStr(d=new Date()){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function computeStreak(routineId){
  const set = new Set(DATA.logs.filter(l=>l.routineId===routineId).map(l=>l.date));
  let streak = 0;
  let cur = new Date();
  for(let i=0;i<400;i++){
    const ds = todayStr(cur);
    if(set.has(ds)){ streak++; }
    else if(ds===todayStr()){ /* today not done yet */ }
    else { break; }
    cur.setDate(cur.getDate()-1);
  }
  return streak;
}
function totalDays(routineId){ return DATA.logs.filter(l=>l.routineId===routineId).length; }

function maxStreakOfDates(dateSet){
  if(dateSet.size===0) return 0;
  const sorted = Array.from(dateSet).sort();
  let d = new Date(sorted[0]);
  const end = new Date();
  let max=0, cur=0;
  while(d<=end){
    if(dateSet.has(todayStr(d))){ cur++; max=Math.max(max,cur); } else { cur=0; }
    d.setDate(d.getDate()+1);
  }
  return max;
}
function computeMaxStreak(routineId){
  return maxStreakOfDates(new Set(DATA.logs.filter(l=>l.routineId===routineId).map(l=>l.date)));
}
function allCurrentStreak(){
  const dates = new Set(DATA.logs.map(l=>l.date));
  let streak=0, d=new Date();
  for(let i=0;i<400;i++){
    const ds = todayStr(d);
    if(dates.has(ds)) streak++;
    else if(ds!==todayStr()) break;
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function allMaxStreak(){
  return maxStreakOfDates(new Set(DATA.logs.map(l=>l.date)));
}

function avgStats(logsArr){
  if(logsArr.length===0) return { avgStart:"--:--", avgDur:"0s" };
  const startMins = logsArr.filter(l=>l.startTime).map(l=>{
    const [h,m] = l.startTime.split(":").map(Number);
    return h*60+m;
  });
  const avgStartMin = startMins.length ? Math.round(startMins.reduce((a,b)=>a+b,0)/startMins.length) : null;
  const avgStart = avgStartMin==null ? "--:--" :
    `${String(Math.floor(avgStartMin/60)).padStart(2,"0")}:${String(avgStartMin%60).padStart(2,"0")}`;
  const avgDurSec = Math.round(logsArr.reduce((a,l)=>a+l.actualSeconds,0)/logsArr.length);
  const avgDur = avgDurSec>=60 ? `${Math.floor(avgDurSec/60)}m ${avgDurSec%60}s` : `${avgDurSec}s`;
  return { avgStart, avgDur };
}

function monthGridHTML(routineFilter){
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const relevantDates = new Set(
    DATA.logs.filter(l=> routineFilter==="all" || l.routineId===routineFilter).map(l=>l.date)
  );
  let cells = "";
  for(let i=0;i<startWeekday;i++) cells += `<div class="mday empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const ds = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const isToday = ds===todayStr();
    const done = relevantDates.has(ds);
    let cls = "mday";
    if(isToday) cls += " today"; else if(done) cls += " done";
    cells += `<div class="${cls}">${day}</div>`;
  }
  const heads = ["日","月","火","水","木","金","土"].map(d=>`<div>${d}</div>`).join("");
  return `<div class="month-head">${heads}</div><div class="month-grid">${cells}</div>`;
}

let STATS_FILTER = "all";

function renderStats(){
  const chips = [{id:"all", name:"まとめ"}, ...DATA.routines.map(r=>({id:r.id, name:r.name}))]
    .map(c=>`<button class="chip ${STATS_FILTER===c.id?'on':''}" data-filter="${c.id}">${escapeHtml(c.name)}</button>`).join("");

  let streakCur, streakMax, total, logsForAvg;
  if(STATS_FILTER==="all"){
    streakCur = allCurrentStreak(); streakMax = allMaxStreak(); total = DATA.logs.length;
    logsForAvg = DATA.logs;
  } else {
    streakCur = computeStreak(STATS_FILTER); streakMax = computeMaxStreak(STATS_FILTER); total = totalDays(STATS_FILTER);
    logsForAvg = DATA.logs.filter(l=>l.routineId===STATS_FILTER);
  }
  const { avgStart, avgDur } = avgStats(logsForAvg);
  const now = new Date();

  root.innerHTML = `
    <div class="topbar">
      <div class="brand">ROUTINEFORGE</div>
      <div class="tabs">
        <button data-tab="list">ルーティン</button>
        <button class="active" data-tab="stats">統計</button>
      </div>
    </div>
    <div class="chip-row">${chips}</div>
    <div class="stats-body">
      <div class="well stat-row">
        <div class="stat-tile"><div class="lbl">継続日数</div><div class="val">${streakCur}</div></div>
        <div class="stat-tile"><div class="lbl">最大継続日数</div><div class="val">${streakMax}</div></div>
        <div class="stat-tile"><div class="lbl">合計</div><div class="val">${total}</div></div>
      </div>
      <div class="well stat-row">
        <div class="stat-tile"><div class="lbl">平均開始時間</div><div class="val" style="font-size:20px">${avgStart}</div></div>
        <div class="stat-tile"><div class="lbl">平均時間</div><div class="val" style="font-size:20px">${avgDur}</div></div>
      </div>
      <div class="well month-well">
        <div class="month-title">${now.getFullYear()}年${now.getMonth()+1}月</div>
        ${monthGridHTML(STATS_FILTER)}
      </div>
    </div>
  `;
  root.querySelectorAll("[data-tab]").forEach(el=>{
    el.addEventListener("click", ()=> nav({name: el.dataset.tab==="stats" ? "stats" : "list"}));
  });
  root.querySelectorAll("[data-filter]").forEach(el=>{
    el.addEventListener("click", ()=>{ STATS_FILTER = el.dataset.filter; renderStats(); });
  });
}

/* ============ view state ============ */
let VIEW = { name:"list" };
const root = document.getElementById("app");

function nav(view){ VIEW = view; render(); }

function render(){
  if(VIEW.name==="list") renderList();
  else if(VIEW.name==="stats") renderStats();
  else if(VIEW.name==="timer") renderTimer();
  else if(VIEW.name==="summary") renderSummary();
  else if(VIEW.name==="edit") renderEdit();
}

/* ============ LIST VIEW ============ */
function renderList(){
  const cards = DATA.routines.map(r=>{
    const streak = computeStreak(r.id);
    const doneToday = DATA.logs.some(l=>l.routineId===r.id && l.date===todayStr());
    const btn = doneToday
      ? `<button class="btn-sq redo" data-start="${r.id}" aria-label="もう一度実行">済</button>`
      : `<button class="btn-sq play" data-start="${r.id}" aria-label="開始">${px(ICON.play)}</button>`;
    return `
    <div class="well rcard${doneToday? " done-today" : ""}">
      <div class="meta" data-edit="${r.id}">
        <div class="name">${escapeHtml(r.name)}</div>
        <div class="sub">全${r.steps.length}項目　${fmtTotal(r)}</div>
      </div>
      <div class="streak"><b>${streak}</b>継続日</div>
      ${btn}
    </div>`;
  }).join("");

  root.innerHTML = `
    <div class="topbar">
      <div class="brand">ROUTINEFORGE</div>
      <div class="tabs">
        <button class="active" data-tab="list">ルーティン</button>
        <button data-tab="stats">統計</button>
      </div>
    </div>
    <div class="list">
      ${cards || `<div class="empty-hint">右下の＋からルーティンを追加してください</div>`}
    </div>
    <button class="fab" id="fabAdd" aria-label="ルーティンを追加">${px(ICON.plus)}</button>
  `;
  root.querySelectorAll("[data-start]").forEach(el=>{
    el.addEventListener("click", ()=> startRoutine(el.dataset.start));
  });
  root.querySelectorAll("[data-edit]").forEach(el=>{
    el.addEventListener("click", ()=> nav({name:"edit", routineId: el.dataset.edit}));
  });
  root.querySelectorAll("[data-tab]").forEach(el=>{
    el.addEventListener("click", ()=> nav({name: el.dataset.tab==="stats" ? "stats" : "list"}));
  });
  document.getElementById("fabAdd").addEventListener("click", ()=> nav({name:"edit", routineId:null}));
}

function fmtTotal(r){
  const sec = r.steps.reduce((a,s)=>a+s.duration,0);
  const m = Math.round(sec/60);
  return `約${m}分`;
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ============ TIMER ============ */
let timerState = null;

function startRoutine(routineId){
  const routine = DATA.routines.find(r=>r.id===routineId);
  if(!routine || routine.steps.length===0) return;
  ensureAudio();
  acquireWakeLock();
  const steps = routine.steps.map(s=>({...s}));
  timerState = { routine, steps, idx:0, remaining: steps[0].duration, elapsed:0, running:true, stepActuals:[], startedAt: Date.now() };
  nav({name:"timer"});
  runTick();
}

function stopTimer(){
  if(timerState){ clearInterval(timerState.timerHandle); }
  timerState = null;
  releaseWakeLock();
}

function runTick(){
  clearInterval(timerState.timerHandle);
  timerState.timerHandle = setInterval(()=>{
    if(!timerState || !timerState.running) return;
    timerState.remaining--;
    timerState.elapsed++;
    if(timerState.remaining === 0) beepTimeUp();
    updateTimerDynamic();
  }, 1000);
}

function adjustRemaining(deltaSec){
  if(!timerState) return;
  timerState.remaining += deltaSec;
  updateTimerDynamic();
}

function completeCurrentStep(){
  const step = timerState.steps[timerState.idx];
  timerState.stepActuals.push({name:step.name, duration:step.duration, actual:timerState.elapsed});
  beepAdvance();
  advanceAfterStep();
}

function advanceAfterStep(){
  if(timerState.idx < timerState.steps.length-1){
    timerState.idx++;
    timerState.remaining = timerState.steps[timerState.idx].duration;
    timerState.elapsed = 0;
    renderTimer();
  } else {
    finishRoutine();
  }
}

function openSkipModal(){
  const modal = document.createElement("div");
  modal.className = "modal-backdrop";
  modal.innerHTML = `
    <div class="modal-sheet well">
      <div class="modal-title">スキップしますか？</div>
      <button class="btn-wide" id="mSkipMoveEnd">タスクを最後に移動</button>
      <button class="btn-wide danger" id="mSkipDrop">スキップ（記録しない）</button>
      <button class="btn-wide ghost" id="mSkipCancel">キャンセル</button>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener("click", (e)=>{ if(e.target===modal) modal.remove(); });
  document.getElementById("mSkipCancel").addEventListener("click", ()=> modal.remove());
  document.getElementById("mSkipMoveEnd").addEventListener("click", ()=>{
    modal.remove();
    const step = timerState.steps.splice(timerState.idx,1)[0];
    timerState.steps.push(step);
    if(timerState.idx >= timerState.steps.length){ finishRoutine(); return; }
    timerState.remaining = timerState.steps[timerState.idx].duration;
    timerState.elapsed = 0;
    renderTimer();
  });
  document.getElementById("mSkipDrop").addEventListener("click", ()=>{
    modal.remove();
    const step = timerState.steps.splice(timerState.idx,1)[0];
    timerState.stepActuals.push({name:step.name, duration:step.duration, actual:0, skipped:true});
    if(timerState.idx >= timerState.steps.length){ finishRoutine(); return; }
    timerState.remaining = timerState.steps[timerState.idx].duration;
    timerState.elapsed = 0;
    renderTimer();
  });
}

function finishRoutine(){
  clearInterval(timerState.timerHandle);
  const routine = timerState.routine;
  const plannedTotal = timerState.stepActuals.reduce((a,s)=>a+s.duration,0);
  const actualTotal = timerState.stepActuals.reduce((a,s)=>a+s.actual,0);
  const start = new Date(timerState.startedAt);
  const startTime = `${String(start.getHours()).padStart(2,"0")}:${String(start.getMinutes()).padStart(2,"0")}`;
  const log = { date: todayStr(), routineId: routine.id, plannedSeconds: plannedTotal,
    actualSeconds: actualTotal, startTime, steps: timerState.stepActuals };
  DATA.logs.push(log);
  saveData(DATA);
  releaseWakeLock();
  const streak = computeStreak(routine.id);
  timerState = null;
  showCelebration(streak, ()=> nav({name:"summary", log, routine}));
}

function showCelebration(streak, done){
  const el = document.createElement("div");
  el.className = "celebrate flash";
  el.innerHTML = `<div class="txt">継続日数${streak}日目になりました!</div>`;
  for(let i=0;i<10;i++){
    const s = document.createElement("div");
    s.className = "spark";
    s.style.left = (10+Math.random()*80)+"%";
    s.style.top = (20+Math.random()*60)+"%";
    s.style.animationDelay = (Math.random()*0.5)+"s";
    el.appendChild(s);
  }
  document.body.appendChild(el);
  setTimeout(()=>{ el.remove(); done(); }, 1700);
}

function fmtMMSS(sec){
  const neg = sec < 0;
  sec = Math.abs(sec);
  const m = String(Math.floor(sec/60)).padStart(2,"0");
  const s = String(sec%60).padStart(2,"0");
  return (neg?"-":"") + `${m}:${s}`;
}

const RING_SEGS = 20;
function tickClasses(duration, remaining){
  const overtime = remaining < 0;
  const ratio = overtime ? 1 : (1 - remaining/duration);
  const onSegs = Math.min(RING_SEGS, Math.round(ratio*RING_SEGS));
  const warnLate = !overtime && remaining < 10;
  const arr = [];
  for(let i=0;i<RING_SEGS;i++){
    if(overtime) arr.push("over");
    else if(i<onSegs) arr.push(warnLate?"warn":"on");
    else arr.push("");
  }
  return { arr, overtime };
}

function ringSVG(arr){
  let ticks = "";
  for(let i=0;i<arr.length;i++){
    const angle = i*(360/arr.length);
    const cls = "ring-tick" + (arr[i] ? " "+arr[i] : "");
    ticks += `<rect class="${cls}" x="47" y="2" width="6" height="14" transform="rotate(${angle} 50 50)"></rect>`;
  }
  return `<svg class="ring" viewBox="0 0 100 100">${ticks}</svg>`;
}

function etaInfo(){
  const { idx, remaining, steps } = timerState;
  const remainingStepsSec = steps.slice(idx).reduce((a,s,i)=> a + (i===0?Math.max(0,remaining):s.duration),0);
  const eta = new Date(Date.now()+remainingStepsSec*1000);
  const etaStr = `${String(eta.getHours()).padStart(2,"0")}:${String(eta.getMinutes()).padStart(2,"0")}`;
  return `残り ${fmtMMSS(remainingStepsSec)}　　終了予定 ${etaStr}`;
}

function renderTimer(){
  const { idx, remaining, steps, running } = timerState;
  const step = steps[idx];
  const { arr, overtime } = tickClasses(step.duration, remaining);

  const previewRows = steps.map((s,i)=>{
    let cls = "row";
    if(i<idx) cls+=" done"; else if(i===idx) cls+=" cur";
    const mk = i===idx ? "▶" : (i<idx ? "" : "");
    return `<div class="${cls}"><span class="mk">${mk}</span>${escapeHtml(s.name)}<span style="margin-left:auto" class="mono">${Math.round(s.duration/60)}分</span></div>`;
  }).join("");

  root.innerHTML = `
    <div class="timer-wrap${running? "" : " paused"}">
      <div class="timer-head">
        <button id="tClose" aria-label="中断して戻る">${px(ICON.close)}</button>
        <div class="mono" style="font-size:11px;color:var(--tx2)">${escapeHtml(timerState.routine.name)}</div>
        <div style="width:32px"></div>
      </div>
      <div class="step-name">${escapeHtml(step.name)}</div>
      <div class="ring-wrap">
        ${ringSVG(arr)}
        <div class="ring-inner">
          <div class="countdown${overtime?' over':''}" id="cd">${fmtMMSS(remaining)}</div>
          <div class="step-count">${idx+1} / ${steps.length}</div>
          <div id="stateLabel">${overtime? `<div class="over-label">予定時間オーバー</div>` : (running? "" : `<div class="pause-label">一時停止中</div>`)}</div>
        </div>
      </div>
      <div class="time-adjust">
        <button id="tMinus">−1分</button>
        <button id="tPlus">+1分</button>
      </div>
      <div class="timer-controls">
        <button id="tPause" aria-label="${running? "一時停止":"再開"}">${px(running? ICON.pause : ICON.play)}</button>
        <button class="main" id="tDone" aria-label="このステップを完了">${px(ICON.check)}</button>
        <button id="tSkip" aria-label="スキップ">${px(ICON.skip)}</button>
      </div>
      <div class="step-preview">${previewRows}</div>
      <div class="finish-eta" id="etaLine">${etaInfo()}</div>
    </div>
  `;
  document.getElementById("tClose").addEventListener("click", ()=>{
    stopTimer(); nav({name:"list"});
  });
  document.getElementById("tPause").addEventListener("click", ()=>{
    timerState.running = !timerState.running; renderTimer();
  });
  document.getElementById("tDone").addEventListener("click", completeCurrentStep);
  document.getElementById("tSkip").addEventListener("click", openSkipModal);
  document.getElementById("tMinus").addEventListener("click", ()=> adjustRemaining(-60));
  document.getElementById("tPlus").addEventListener("click", ()=> adjustRemaining(60));
}

function updateTimerDynamic(){
  if(!timerState) return;
  const step = timerState.steps[timerState.idx];
  const { arr, overtime } = tickClasses(step.duration, timerState.remaining);

  const cd = document.getElementById("cd");
  if(cd){
    cd.textContent = fmtMMSS(timerState.remaining);
    cd.className = "countdown" + (overtime?" over":"");
  }
  root.querySelectorAll(".ring-tick").forEach((el,i)=>{
    el.setAttribute("class", "ring-tick" + (arr[i] ? " "+arr[i] : ""));
  });
  const stateLabel = document.getElementById("stateLabel");
  if(stateLabel){
    stateLabel.innerHTML = overtime ? `<div class="over-label">予定時間オーバー</div>`
      : (timerState.running ? "" : `<div class="pause-label">一時停止中</div>`);
  }
  const etaLine = document.getElementById("etaLine");
  if(etaLine) etaLine.textContent = etaInfo();
}

/* ============ SUMMARY ============ */
function renderSummary(){
  const { log, routine } = VIEW;
  const streak = computeStreak(routine.id);
  const total = totalDays(routine.id);
  const diff = log.actualSeconds - log.plannedSeconds;
  const overrun = diff > 0;
  const diffStr = (overrun? "+":"-") + fmtMMSS(Math.abs(diff));

  const rows = log.steps.map(s=>{
    const stepOver = !s.skipped && s.actual > s.duration;
    return `
    <div class="srow${s.skipped? "" : " done"}">
      <div class="nm">${escapeHtml(s.name)}</div>
      <div class="tm mono${stepOver? " overrun":""}">${Math.floor(s.actual/60)}分${s.actual%60}秒</div>
      <div class="ck">${s.skipped? "－" : "✓"}</div>
    </div>`;
  }).join("");

  root.innerHTML = `
    <div class="topbar">
      <div class="brand">${escapeHtml(routine.name)}</div>
      <div class="mono" style="font-size:11px;color:var(--tx3)">${log.startTime||""} 開始</div>
    </div>
    <div class="summary">
      <div class="well stat-row">
        <div class="stat-tile"><div class="lbl">継続日数</div><div class="val">${streak}</div></div>
        <div class="stat-tile"><div class="lbl">合計日数</div><div class="val">${total}</div></div>
      </div>
      <div class="well">
        <div class="total-row">
          <div><div class="lbl" style="font-size:11px;color:var(--tx2)">合計</div>
          <div class="val mono">${fmtMMSS(log.actualSeconds)}</div></div>
          <div class="diff${overrun? " overrun":""}">${diffStr}</div>
        </div>
        <div class="slist">${rows}</div>
      </div>
      <button class="btn-wide" id="backList">一覧にもどる</button>
    </div>
  `;
  document.getElementById("backList").addEventListener("click", ()=> nav({name:"list"}));
}

/* ============ EDIT ============ */
let editDraft = null;

function renderEdit(){
  const routineId = VIEW.routineId;
  const existing = routineId ? DATA.routines.find(r=>r.id===routineId) : null;
  editDraft = existing ? JSON.parse(JSON.stringify(existing)) : {
    id: "r_"+Date.now(), name:"", steps:[]
  };
  paintEdit();
}

function paintEdit(){
  const d = editDraft;
  const stepsHtml = d.steps.map((s,i)=>`
    <div class="step-row" data-idx="${i}">
      <div class="ord">
        <button data-mv="${i},-1" ${i===0?"disabled":""} aria-label="上へ">${px(ICON.up)}</button>
        <button data-mv="${i},1" ${i===d.steps.length-1?"disabled":""} aria-label="下へ">${px(ICON.down)}</button>
      </div>
      <input type="text" value="${escapeHtml(s.name)}" placeholder="ステップ名" data-field="name" data-idx="${i}" />
      <input type="number" class="dur" min="1" step="1" value="${Math.max(1, Math.round(s.duration/60))}" data-field="duration" data-idx="${i}" title="分" />
      <button class="rm" data-rm="${i}" aria-label="削除">${px(ICON.close)}</button>
    </div>`).join("");

  root.innerHTML = `
    <div class="topbar">
      <button id="eCancel" style="background:none;border:none;color:var(--tx2);font-size:13px;">キャンセル</button>
      <div class="brand">${DATA.routines.find(r=>r.id===d.id) ? '編集' : '新規ルーティン'}</div>
      <div style="width:50px"></div>
    </div>
    <div class="form">
      <div class="field">
        <label>ルーティン名</label>
        <input type="text" id="fName" value="${escapeHtml(d.name)}" placeholder="例: 朝のルーティン" />
      </div>
      <div class="field">
        <label>ステップ（数値は予定時間、分単位）</label>
        <div class="steps-edit" id="stepsEdit">${stepsHtml}</div>
        <button class="add-step-btn" id="addStep">＋ ステップを追加</button>
      </div>
      <button class="btn-wide" id="saveRoutine">保存する</button>
      ${DATA.routines.find(r=>r.id===d.id) ? `<button class="danger-btn" id="delRoutine">このルーティンを削除</button>` : ""}
    </div>
  `;

  document.getElementById("eCancel").addEventListener("click", ()=> nav({name:"list"}));
  document.getElementById("fName").addEventListener("input", e=> d.name = e.target.value);
  root.querySelectorAll("[data-field]").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const i = Number(inp.dataset.idx); const f = inp.dataset.field;
      d.steps[i][f] = f==="duration" ? Math.max(1, Number(inp.value)||10)*60 : inp.value;
    });
  });
  root.querySelectorAll("[data-mv]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const [i, dir] = btn.dataset.mv.split(",").map(Number);
      const j = i + dir;
      if(j<0 || j>=d.steps.length) return;
      [d.steps[i], d.steps[j]] = [d.steps[j], d.steps[i]];
      paintEdit();
    });
  });
  root.querySelectorAll("[data-rm]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      d.steps.splice(Number(btn.dataset.rm),1); paintEdit();
    });
  });
  document.getElementById("addStep").addEventListener("click", ()=>{
    d.steps.push({id:"s_"+Date.now(), name:"", duration:600});
    paintEdit();
    const inputs = root.querySelectorAll('[data-field="name"]');
    if(inputs.length) inputs[inputs.length-1].focus();
  });
  document.getElementById("saveRoutine").addEventListener("click", ()=>{
    if(!d.name.trim()){ alert("ルーティン名を入力してください"); return; }
    d.steps = d.steps.filter(s=>s.name.trim());
    if(d.steps.length===0){ alert("ステップを1つ以上追加してください"); return; }
    const idx = DATA.routines.findIndex(r=>r.id===d.id);
    if(idx>=0) DATA.routines[idx] = d; else DATA.routines.push(d);
    saveData(DATA);
    nav({name:"list"});
  });
  const delBtn = document.getElementById("delRoutine");
  if(delBtn) delBtn.addEventListener("click", ()=>{
    if(!confirm("このルーティンを削除しますか？")) return;
    DATA.routines = DATA.routines.filter(r=>r.id!==d.id);
    DATA.logs = DATA.logs.filter(l=>l.routineId!==d.id);
    saveData(DATA);
    nav({name:"list"});
  });
}

/* ============ boot ============ */
render();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
